<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastal Quest · ภารกิจ 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17392f;color:#eff3dd;font-family:Tahoma,sans-serif}canvas{width:100%;height:100%;display:block;outline:0}#gate{position:absolute;inset:0;display:flex;flex-direction:column;gap:15px;align-items:center;justify-content:center;background:linear-gradient(135deg,#173b32ee,#192b2de8);text-align:center;padding:30px}h1{font-size:25px;letter-spacing:3px;margin:0 0 10px}p{font-size:12px;color:#a6bda7;line-height:1.9;max-width:340px}button{background:#f8d867;color:#263728;border:0;border-radius:8px;padding:14px 28px;font-weight:bold;font-size:15px;cursor:pointer}button:disabled{opacity:.4;cursor:wait}progress{width:230px;height:6px;accent-color:#f8d867}small{font-size:10px;color:#849c87}.mark{font-size:45px;color:#f8d867}#error{color:#ffd6b7}</style></head><body><canvas id="canvas" tabindex="0"></canvas><div id="gate"><span class="mark">✦</span><h1>COASTAL QUEST</h1><p id="message">กำลังเตรียมเกาะแห่งความรู้<br>โหลดครั้งแรกประมาณ 7 MB</p><progress id="progress" value="0" max="1"></progress><button id="start" disabled>กำลังโหลด...</button><small>แนะนำคอมพิวเตอร์ พร้อมเมาส์และคีย์บอร์ด</small><p id="error"></p></div><script src="Build/game.loader.js"></script><script>
let instance,started=false,needsResume=false,quizOpen=false,roomPaused=false,configuration={mode:'solo'},rewards=[],classroom={paused:false};
const gate=document.getElementById('gate'),start=document.getElementById('start'),canvas=document.getElementById('canvas');
const tell=data=>parent.postMessage({source:'coastal-quest-unity',...data},location.origin);
function send(method,value=''){if(instance)instance.SendMessage('GameManager',method,typeof value==='string'?value:JSON.stringify(value));}
function sync(){if(started)send('UpdateClassroom',{...classroom,paused:roomPaused||quizOpen||needsResume});}
createUnityInstance(canvas,{dataUrl:'Build/game.data.unityweb',frameworkUrl:'Build/game.framework.js.unityweb',codeUrl:'Build/game.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Coastal Quest',productName:'Coastal Quest Classroom',productVersion:'0.3',devicePixelRatio:Math.min(devicePixelRatio,1.5),showBanner:(message,type)=>{if(type==='error'){document.getElementById('error').textContent=message;tell({type:'error',message});}}},value=>document.getElementById('progress').value=value).then(game=>{instance=game;start.disabled=false;start.textContent='คลิกเพื่อเข้าเกม';document.getElementById('message').textContent='ตอบคำถามรับเสบียง แล้วออกผจญภัยบนเกาะ';document.getElementById('progress').hidden=true;tell({type:'ready'});}).catch(error=>{document.getElementById('error').textContent='โหลดเกมไม่สำเร็จ: '+error;tell({type:'error',message:String(error)});});
start.onclick=()=>{if(!instance)return;if(!started){send('ConfigureClassroom',configuration);started=true;for(const reward of rewards)send('GrantReward',reward);rewards=[];}needsResume=false;send('SetQuizOpen',quizOpen?'1':'0');sync();if(!quizOpen&&!roomPaused){gate.style.display='none';canvas.focus();if(!document.pointerLockElement)canvas.requestPointerLock?.();}};
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.source!=='coastal-quest-host')return;const data=event.data;if(data.type==='configure'){configuration={mode:data.mode};roomPaused=!!data.paused;sync();}if(data.type==='reward'){if(started)send('GrantReward',data.reward);else rewards.push(data.reward);}if(data.type==='classroom'){classroom={paused:!!data.paused,bossRemaining:data.bossRemaining??1,bossMax:data.bossMax??0};roomPaused=!!data.paused;sync();}if(data.type==='quiz'){quizOpen=!!data.open;if(started)send('SetQuizOpen',quizOpen?'1':'0');if(!quizOpen&&started){needsResume=true;gate.style.display='flex';start.textContent='คลิกเพื่อกลับเข้าเกม';}sync();}if(data.type==='energy')send('UseEnergy');if(data.type==='shield')send('UseShield');});
addEventListener('message',event=>{if(event.origin===location.origin&&event.source===window&&event.data?.type==='question'){quizOpen=true;sync();}});
</script></body></html>
